<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
    <style>
      .pulse { stroke-dasharray: 70 1130; animation: run 3.2s linear infinite; }
      .pulse2 { stroke-dasharray: 40 1160; animation: run 2.4s linear infinite; animation-delay: 1.1s; }
      .core { transform-origin: 600px 20px; animation: beat 2.2s ease-in-out infinite; }
      @keyframes run { to { stroke-dashoffset: -1200; } }
      @keyframes beat { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    </style>
  </defs>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#dl)" stroke-width="2"/>
  <line class="pulse" x1="0" y1="20" x2="1200" y2="20" stroke="#7ee787" stroke-width="3" stroke-linecap="round"/>
  <line class="pulse2" x1="0" y1="20" x2="1200" y2="20" stroke="#9fd3ff" stroke-width="3" stroke-linecap="round"/>
  <g class="core">
    <rect x="590" y="10" width="20" height="20" rx="4" transform="rotate(45 600 20)" fill="#0b1220" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="600" cy="20" r="3" fill="#00d4ff"/>
  </g>
</svg>
