<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 96" width="1200" height="96" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1220"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080d16" stop-opacity="1"/>
      <stop offset="1" stop-color="#080d16" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#080d16" stop-opacity="1"/>
      <stop offset="1" stop-color="#080d16" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="96" rx="16"/>
    </clipPath>
    <style>
      .marquee { animation: scroll 26s linear infinite; }
      @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
      .pill { fill: #0e1726; stroke: #22354f; stroke-width: 1; }
      .lbl { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #c9d1d9; }
    </style>
  </defs>

  <rect width="1200" height="96" rx="16" fill="url(#sbg)"/>
  <rect width="1200" height="96" rx="16" fill="none" stroke="#1f6feb" stroke-opacity="0.3"/>

  <g clip-path="url(#clip)">
    <g class="marquee">
      <g id="row">
        <g transform="translate(6,0)">
          <rect class="pill" x="0" y="22" width="138" height="52" rx="26"/>
          <g transform="translate(22,48)" stroke="#f80000" stroke-width="2" fill="none">
            <ellipse cx="0" cy="-6" rx="9" ry="3.5"/>
            <path d="M-9 -6 V6 a9 3.5 0 0 0 18 0 V-6"/>
            <path d="M-9 0 a9 3.5 0 0 0 18 0"/>
          </g>
          <text class="lbl" x="40" y="54">Oracle DB</text>
        </g>

        <g transform="translate(156,0)">
          <rect class="pill" x="0" y="22" width="138" height="52" rx="26"/>
          <text x="22" y="54" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="18" font-weight="700" fill="#f80000">{ }</text>
          <text class="lbl" x="40" y="54">PL/SQL</text>
        </g>

        <g transform="translate(306,0)">
          <rect class="pill" x="0" y="22" width="138" height="52" rx="26"/>
          <g transform="translate(22,48)" stroke="#00b4d8" stroke-width="2" fill="none">
            <rect x="-9" y="-8" width="18" height="16" rx="2"/>
            <line x1="-9" y1="-2" x2="9" y2="-2"/>
            <line x1="-9" y1="4" x2="9" y2="4"/>
            <line x1="-1" y1="-8" x2="-1" y2="8"/>
          </g>
          <text class="lbl" x="40" y="54">SQL</text>
        </g>

        <g transform="translate(456,0)">
          <rect class="pill" x="0" y="22" width="138" height="52" rx="26"/>
          <g transform="translate(22,48)" stroke="#e76f00" stroke-width="2" fill="none" stroke-linecap="round">
            <path d="M-7 -1 h14 v4 a7 7 0 0 1 -14 0 z"/>
            <path d="M7 1 h3 a3 3 0 0 1 0 5 h-3"/>
            <path d="M-3 -5 q3 -2.5 0 -5"/>
            <path d="M2 -5 q3 -2.5 0 -5"/>
          </g>
          <text class="lbl" x="40" y="54">Java</text>
        </g>

        <g transform="translate(606,0)">
          <rect class="pill" x="0" y="22" width="138" height="52" rx="26"/>
          <g transform="translate(22,48)" stroke="#f05032" stroke-width="2">
            <path d="M-6 -4 V4" fill="none"/>
            <path d="M-6 -1 C 3 -1 7 -4 7 -2" fill="none"/>
            <circle cx="-6" cy="-7" r="3" fill="#f05032"/>
            <circle cx="-6" cy="7" r="3" fill="#f05032"/>
            <circle cx="7" cy="0" r="3" fill="#f05032"/>
          </g>
          <text class="lbl" x="40" y="54">Git</text>
        </g>

        <g transform="translate(756,0)">
          <rect class="pill" x="0" y="22" width="138" height="52" rx="26"/>
          <g transform="translate(22,48)">
            <circle cx="0" cy="0" r="9" fill="none" stroke="#2088ff" stroke-width="2"/>
            <path d="M-3 -4 L5 0 L-3 4 Z" fill="#2088ff"/>
          </g>
          <text class="lbl" x="40" y="54">GH Actions</text>
        </g>

        <g transform="translate(906,0)">
          <rect class="pill" x="0" y="22" width="138" height="52" rx="26"/>
          <g transform="translate(22,48)" stroke="#00b4d8" stroke-width="2" fill="#00b4d8">
            <path d="M-8 6 L0 -7 L8 6" fill="none"/>
            <circle cx="-8" cy="6" r="3"/>
            <circle cx="8" cy="6" r="3"/>
            <circle cx="0" cy="-7" r="3"/>
          </g>
          <text class="lbl" x="40" y="54">CCNA</text>
        </g>

        <g transform="translate(1056,0)">
          <rect class="pill" x="0" y="22" width="138" height="52" rx="26"/>
          <g transform="translate(22,48)">
            <path d="M-2 -9 h4 a5 5 0 0 1 5 5 v3 h-9 a4 4 0 0 1 -4 -4 v0 a4 4 0 0 1 4 -4 z" fill="#3776ab"/>
            <path d="M2 9 h-4 a5 5 0 0 1 -5 -5 v-3 h9 a4 4 0 0 1 4 4 v0 a4 4 0 0 1 -4 4 z" fill="#ffd43b"/>
            <circle cx="1.5" cy="-5.5" r="1.3" fill="#ffffff"/>
            <circle cx="-1.5" cy="5.5" r="1.3" fill="#0b1220"/>
          </g>
          <text class="lbl" x="40" y="54">Python</text>
        </g>
      </g>
      <use xlink:href="#row" x="1200"/>
    </g>
    <rect x="0" y="0" width="120" height="96" fill="url(#fadeL)"/>
    <rect x="1080" y="0" width="120" height="96" fill="url(#fadeR)"/>
  </g>
</svg>
