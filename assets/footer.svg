<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.5" stop-color="#0b1424"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#28405c" opacity="0.5"/>
    </pattern>
    <style>
      .fp { stroke-dasharray: 50 350; animation: frun 3.6s linear infinite; }
      .fp2 { stroke-dasharray: 30 370; animation: frun 2.6s linear infinite; animation-delay: 1.2s; }
      .fdot { animation: fblink 2.4s ease-in-out infinite; }
      .fdot2 { animation-delay: 0.8s; }
      .fdot3 { animation-delay: 1.6s; }
      @keyframes frun { to { stroke-dashoffset: -400; } }
      @keyframes fblink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="1198.5" height="148.5" rx="18" fill="url(#fbg)" stroke="#1f6feb" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="0" y="0" width="1200" height="150" rx="18" fill="url(#fdots)" opacity="0.5"/>
  <circle cx="600" cy="150" r="200" fill="url(#fglow)"/>
  <line x1="0" y1="20" x2="1200" y2="20" stroke="url(#fl)" stroke-width="2"/>

  <g stroke="#24507f" stroke-width="2" fill="none" opacity="0.7">
    <path d="M60 20 V60 H120 V96"/>
    <path d="M1140 20 V60 H1080 V96"/>
    <path d="M180 130 H420"/>
    <path d="M1020 130 H780"/>
  </g>
  <line class="fp" x1="60" y1="100" x2="460" y2="100" stroke="#7ee787" stroke-width="2.5" stroke-linecap="round"/>
  <line class="fp2" x1="1140" y1="100" x2="740" y2="100" stroke="#9fd3ff" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#2ea043">
    <circle class="fdot" cx="60" cy="20" r="4"/>
    <circle class="fdot2" cx="1140" cy="20" r="4"/>
  </g>
  <g fill="#00d4ff">
    <circle class="fdot3" cx="420" cy="130" r="3.5"/>
    <circle class="fdot" cx="780" cy="130" r="3.5"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="66" font-size="22" font-weight="700" fill="#ffffff">Gracias por visitar mi perfil</text>
    <text x="600" y="96" font-size="16" fill="#8b949e">Thanks for stopping by</text>
    <text x="600" y="126" font-family="ui-monospace, Consolas, monospace" font-size="13" fill="#6e7b91">antoniorep7  ·  github.com/antoniorep7</text>
  </g>
</svg>
